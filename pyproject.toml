[tool.poetry]
name = "avcicms"
version = "0.1.0"
description = "AVCI CMS Python SDK"
authors = ["AVCI CMS <info@avcicms.com>"]
readme = "README.md"
packages = [{include = "avcicms"}]
exclude = ["generate.sh", "openapi.json"]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27.0"
pydantic = "^2.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "datamodel-code-generator (>=0.58.0,<0.59.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
